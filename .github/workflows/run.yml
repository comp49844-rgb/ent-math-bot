name: ent-math-bot
on:
  schedule:
    - cron: "0 5,13 * * *"   # 10:00 и 18:00 по Казахстану (UTC+5)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post next task
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
      - name: Save progress
        run: |
          git config user.name "ent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "next task"
          git push
